<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="한국의 외국인 진료 지원 가능 기관을 찾는 지도 서비스" />
    <title>외국인 진료소 찾기 | 행동하는의사회</title>
    <link rel="preconnect" href="https://oapi.map.naver.com" />
    <style>
      :root { --ink: #17212b; --muted: #6b7785; --line: #e4e8ec; --blue: #1769d2; --pale: #f4f7fb; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; color: var(--ink); background: var(--pale); font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      button, input { font: inherit; }
      .app { height: 100vh; height: 100dvh; min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); overflow: hidden; }
      header { background: #fff; border-bottom: 1px solid var(--line); padding: 22px 32px 18px; }
      .brand { max-width: 1440px; margin: auto; display: flex; align-items: baseline; justify-content: space-between; gap: 24px; }
      .eyebrow { margin: 0 0 5px; color: var(--blue); font-size: 12px; font-weight: 800; letter-spacing: .12em; }
      h1 { margin: 0; font-size: clamp(22px, 3vw, 32px); letter-spacing: -.05em; }
      .updated { color: var(--muted); font-size: 13px; }
      .workspace { max-width: 1440px; width: 100%; min-width: 0; min-height: 0; margin: 0 auto; padding: 24px 32px 32px; display: grid; grid-template-columns: minmax(280px, 390px) minmax(0, 1fr); gap: 20px; overflow: hidden; }
      .panel, .map-wrap { background: #fff; border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 8px 30px rgba(23,33,43,.05); }
      .panel { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
      .controls { flex: none; padding: 22px; border-bottom: 1px solid var(--line); }
      .controls h2 { margin: 0 0 14px; font-size: 16px; }
      .search { width: 100%; padding: 12px 14px; border: 1px solid #d9e0e7; border-radius: 9px; outline: none; }
      .search:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(23,105,210,.12); }
      .filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 12px; }
      .filter { padding: 9px 5px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--muted); cursor: pointer; font-size: 13px; }
      .filter.active { color: var(--blue); border-color: #a9c9f4; background: #eef6ff; font-weight: 700; }
      .summary { display: flex; gap: 20px; margin-top: 18px; }
      .stat strong { display: block; font-size: 21px; letter-spacing: -.04em; }
      .stat span { color: var(--muted); font-size: 12px; }
      .results { flex: none; padding: 13px 10px 13px 22px; color: var(--muted); font-size: 12px; }
      .hospital-list { flex: 1; min-height: 0; margin: 0; padding: 0 10px 18px 22px; overflow-y: auto; overscroll-behavior: contain; list-style: none; }
      .hospital-list li { border-top: 1px solid var(--line); }
      .hospital { width: 100%; padding: 14px 10px 14px 0; text-align: left; border: 0; background: none; cursor: pointer; }
      .hospital:hover { color: var(--blue); }
      .hospital-name { display: block; margin-bottom: 5px; font-weight: 750; }
      .hospital-meta { color: var(--muted); font-size: 12px; }
      .badge { display: inline-block; margin-left: 5px; padding: 3px 7px; border-radius: 20px; font-size: 10px; font-weight: 700; }
      .badge.yes { color: #087443; background: #e5f8ef; } .badge.no { color: #b32f37; background: #fff0f0; } .badge.unknown { color: #596574; background: #edf0f3; }
      .map-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
      #map { width: 100%; height: 100%; min-height: 0; }
      .map-marker { display: block; width: 16px; height: 16px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 1px 5px rgba(0,0,0,.35); }
      .map-marker.yes { background: #159968; } .map-marker.no { background: #d95059; } .map-marker.unknown { background: #7b8794; }
      .legend { position: absolute; z-index: 500; right: 16px; bottom: 16px; padding: 11px 13px; border: 1px solid var(--line); border-radius: 9px; background: rgba(255,255,255,.95); box-shadow: 0 3px 12px rgba(0,0,0,.08); font-size: 12px; }
      .dot { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 50%; } .dot.yes { background: #159968; } .dot.no { background: #d95059; } .dot.unknown { background: #7b8794; }
      .empty { padding: 30px 0; color: var(--muted); text-align: center; }
      .popup { min-width: 210px; max-width: 280px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; box-shadow: 0 4px 16px rgba(23,33,43,.14); }
      .popup h3 { margin: 0 0 9px; font-size: 16px; } .popup p { margin: 7px 0; font-size: 13px; line-height: 1.5; } .popup .support { font-weight: 700; } .popup .yes { color: #087443; } .popup .no { color: #b32f37; } .popup .unknown { color: #596574; }
      #hospital-dialog { display: none; }
      .hospital-dialog-close { padding: 9px 13px; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: var(--ink); font-weight: 700; cursor: pointer; }
      @media (max-width: 800px) {
        header { padding: 18px 18px 15px; }
        .brand { display: block; }
        .updated { display: none; }
        .workspace { padding: 12px; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(180px, 32vh) minmax(0, 1fr); grid-template-areas: "map" "panel"; gap: 10px; }
        .panel { grid-area: panel; }
        .map-wrap { grid-area: map; }
        .controls { padding: 14px; }
        .controls h2 { margin-bottom: 10px; }
        .search { padding: 10px; }
        .filters { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
        .filter { padding: 8px 2px; font-size: 11px; white-space: nowrap; }
        .summary { gap: 14px; margin-top: 8px; }
        .stat { display: flex; flex-direction: row-reverse; align-items: baseline; gap: 4px; }
        .stat strong, .stat span { color: var(--ink); font-size: 13px; letter-spacing: 0; }
        .stat span::after { content: ":"; }
        #hospital-dialog:not([hidden]) { position: fixed; z-index: 10000; inset: 0; display: flex; align-items: center; justify-content: center; padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom)); background: rgba(23,33,43,.52); }
        .hospital-dialog-card { display: flex; flex-direction: column; width: min(100%, 560px); max-height: calc(100dvh - 40px); overflow: hidden; border-radius: 18px; background: #fff; box-shadow: 0 18px 60px rgba(0,0,0,.24); }
        .hospital-dialog-heading { display: flex; flex: none; align-items: center; gap: 12px; padding: 16px 16px 10px; }
        .hospital-dialog-title { flex: 1; min-width: 0; margin: 0; font-size: 23px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .hospital-dialog-close { flex: none; }
        #hospital-dialog-content { flex: 0 1 auto; min-height: 0; width: 100%; max-height: calc(100dvh - 120px); margin: 0; padding: 0 20px 12px; overflow-y: auto; overscroll-behavior: contain; }
        #hospital-dialog-content .popup { min-width: 0; max-width: none; padding: 12px 0 16px; border: 0; border-radius: 0; box-shadow: none; }
        #hospital-dialog-content .popup h3 { margin-bottom: 18px; font-size: 23px; }
        #hospital-dialog-content .popup p { margin: 14px 0; font-size: 15px; line-height: 1.6; }
      }
      @media (max-width: 800px) and (max-height: 640px) {
        header { padding: 10px 14px; }
        .updated { margin-top: 4px; font-size: 12px; }
        .workspace { padding: 8px; grid-template-rows: minmax(150px, 30vh) minmax(0, 1fr); gap: 8px; }
        .controls { padding: 10px; }
        .controls h2 { margin-bottom: 6px; font-size: 15px; }
        .search { padding: 8px 10px; }
        .filters { gap: 5px; margin-top: 7px; }
        .filter { padding: 6px 4px; }
        .summary { gap: 14px; margin-top: 7px; }
        .stat strong { font-size: 13px; }
        .results { padding: 7px 8px 7px 12px; }
        .hospital-list { padding: 0 8px 8px 12px; }
        .hospital { padding: 9px 8px 9px 0; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header><div class="brand"><div><p class="eyebrow">DAH · 행동하는의사회</p><h1>외국인 진료소 찾기</h1></div><span class="updated">진료 지원 정보를 한눈에 확인하세요</span></div></header>
      <main class="workspace">
        <aside class="panel">
          <div class="controls"><h2>어디서 진료받을 수 있나요?</h2><input id="search" class="search" type="search" placeholder="기관명 또는 지역 검색" aria-label="기관명 또는 지역 검색" /><div class="filters" role="group" aria-label="진료 지원 상태"><button class="filter active" data-filter="all">전체</button><button class="filter" data-filter="yes">지원 가능</button><button class="filter" data-filter="no">지원 불가</button><button class="filter" data-filter="unknown">확인 필요</button></div><div class="summary"><div class="stat"><strong id="total-count">-</strong><span>전체 기관</span></div><div class="stat"><strong id="yes-count">-</strong><span>지원 가능</span></div></div></div>
          <div id="results" class="results">데이터를 불러오는 중입니다.</div>
          <ul id="hospital-list" class="hospital-list" aria-live="polite"></ul>
        </aside>
        <section class="map-wrap" aria-label="진료소 지도"><div id="map"></div><div class="legend"><span class="dot yes"></span>지원 가능&nbsp;&nbsp; <span class="dot no"></span>지원 불가&nbsp;&nbsp; <span class="dot unknown"></span>확인 필요</div></section>
      </main>
      <div id="hospital-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="hospital-dialog-title">
        <div class="hospital-dialog-card">
          <div class="hospital-dialog-heading">
            <h3 id="hospital-dialog-title" class="hospital-dialog-title"></h3>
            <button class="hospital-dialog-close" type="button">닫기</button>
          </div>
          <div id="hospital-dialog-content"></div>
        </div>
      </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
